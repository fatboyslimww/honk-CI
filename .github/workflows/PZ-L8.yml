# SPDX-License-Identifier: MIT
#
# PZ-L8: CMCC PZ-L8 (IPQ5018 + QCA8337 + QCN6122), QSDK NSS build.
#
# This target deliberately does not use WRT-CORE: the NSS board support comes
# from mufeng05/openwrt-cmcc-pz-l8-nss, which is pinned to the official OpenWrt
# v25.12.5 tree. Scripts/apply-pz-l8.sh applies that project's own setup.sh,
# then adds this repository's minimal honk + zram configuration.
#
# The image keeps the NSS/ECM forwarding path and does NOT include the
# X86/ROCKCHIP eBPF/DPD dataplane.

name: PZ-L8

on:
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: 'Extra package lines for .config'
        required: false
        type: string
      TEST:
        description: 'Config-only run (no image)'
        default: false
        required: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pz-l8
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  OPENWRT_REF: v25.12.5
  WRT_SSID: OWRT
  WRT_WORD: 12345678
  WRT_IP: 192.168.10.1

jobs:
  build:
    name: PZ-L8 / OpenWrt v25.12.5
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bc bison build-essential bzip2 ca-certificates \
            clang cmake cpio curl device-tree-compiler file flex g++ g++-multilib \
            gawk gcc-multilib gettext git libelf-dev libncurses-dev libssl-dev \
            libtool make patch perl pkg-config python3 python3-dev \
            python3-pyelftools python3-setuptools rsync swig u-boot-tools \
            unzip wget xz-utils zlib1g-dev zstd
          sudo timedatectl set-timezone "Asia/Shanghai" || true

      - name: Checkout OpenWrt ${{ env.OPENWRT_REF }}
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ env.OPENWRT_REF }}
          path: openwrt
          fetch-depth: 1

      - name: Prepare PZ-L8 NSS tree
        env:
          WRT_CONFIG: PZ-L8
          WRT_PACKAGE: ${{ inputs.PACKAGE }}
        run: |
          bash Scripts/apply-pz-l8.sh "$GITHUB_WORKSPACE/openwrt"
          cd openwrt
          echo "== resolved target =="
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)|^CONFIG_PACKAGE_(honk|luci-app-honk|zram-swap|kmod-zram)=' .config

      - name: Download sources
        if: ${{ !inputs.TEST }}
        run: |
          cd openwrt
          make download -j"$(nproc)" || {
            echo "== download failed, retrying once =="
            sleep 15
            make download -j"$(nproc)"
          }
          # A zero-length file is a silent poison pill later in the build.
          find dl -type f -size -1024c -print -delete || true

      - name: Compile firmware
        if: ${{ !inputs.TEST }}
        run: |
          cd openwrt
          make -j"$(nproc)" || {
            echo "::warning::parallel build failed, retrying single-threaded for a readable log"
            make -j1 V=s
          }

      - name: Build U-Boot recovery images
        if: ${{ success() && !inputs.TEST }}
        run: |
          set -eu
          FIRMWARE="$GITHUB_WORKSPACE/openwrt/bin/targets/qualcommax/ipq50xx"
          UBI=$(ls "$FIRMWARE"/*-squashfs-factory.ubi | head -1)
          [ -n "$UBI" ] || { echo "!! no factory.ubi produced" >&2; exit 1; }
          BASE=${UBI%-squashfs-factory.ubi}
          MIBIB="$GITHUB_WORKSPACE/pzl8-ref/scripts/pz-l8-116m-mibib.bin"

          build_fit() {
            OUT=$1
            EXTRA=${2:-}
            OW="$GITHUB_WORKSPACE/openwrt" \
              python3 "$GITHUB_WORKSPACE/pzl8-ref/scripts/mkrecovery.py" \
              "$UBI" "$OUT" ${EXTRA:+"$EXTRA"}
            SIZE=$(stat -c %s "$OUT")
            echo "$(basename "$OUT"): $SIZE bytes"
            if [ "$SIZE" -gt 33554432 ]; then
              echo "!! $(basename "$OUT") exceeds the U-Boot 32 MiB limit" >&2
              exit 1
            fi
            ( cd "$FIRMWARE" && sha256sum -b "$(basename "$OUT")" >> sha256sums )
          }

          build_fit "$BASE-uboot-recovery.fit"
          build_fit "$BASE-uboot-recovery-116m.fit" "$MIBIB"
          ls -lh "$FIRMWARE"/*-uboot-recovery*.fit

      - name: Collect build metadata
        if: ${{ success() && !inputs.TEST }}
        run: |
          cd openwrt
          FIRMWARE="$GITHUB_WORKSPACE/openwrt/bin/targets/qualcommax/ipq50xx"
          echo "FIRMWARE=$FIRMWARE" >> "$GITHUB_ENV"
          echo "DATE=$(date '+%y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"

          OPENWRT_COMMIT=$(git rev-parse HEAD)
          KVER=$(grep -h -oE '^kernel - [0-9][^ ]*' "$FIRMWARE"/*.manifest 2>/dev/null |
            head -1 | awk '{print $3}')
          cat > "$FIRMWARE/provenance-PZ-L8.txt" <<EOF
          config          PZ-L8
          source          openwrt/openwrt
          branch          ${OPENWRT_REF}
          commit          ${OPENWRT_COMMIT}
          pz_l8_ref       mufeng05/openwrt-cmcc-pz-l8-nss
          pz_l8_commit    ${PZ_L8_REF_COMMIT:-unknown}
          honk_commit     ${HONK_COMMIT:-unknown}
          geo_commit      ${V2RAY_GEODATA_COMMIT:-unknown}
          target          qualcommax/ipq50xx
          kernel          ${KVER:-unknown}
          datapath        qca-nss-drv + qca-nss-ecm
          proxy           honk (stock upstream core)
          swap            zram-swap, 64 MiB, lzo
          built_at        $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          install -m 0644 "$GITHUB_WORKSPACE/Config/PZ-L8.txt" "$FIRMWARE/Config-PZ-L8.txt"
          cp "$GITHUB_WORKSPACE/build-reports/pz-l8-sources.txt" "$FIRMWARE/pz-l8-sources.txt"
          ls -lh "$FIRMWARE"

      - name: Collect config-only artifact
        if: ${{ inputs.TEST }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upload"
          cp openwrt/.config "$GITHUB_WORKSPACE/upload/Config-PZ-L8.txt"
          cp build-reports/pz-l8-sources.txt "$GITHUB_WORKSPACE/upload/" 2>/dev/null || true

      - name: Upload firmware artifact
        if: ${{ success() && !inputs.TEST }}
        uses: actions/upload-artifact@v4
        with:
          name: pz-l8-${{ github.run_id }}
          path: |
            ${{ env.FIRMWARE }}/*.bin
            ${{ env.FIRMWARE }}/*.ubi
            ${{ env.FIRMWARE }}/*.fit
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/*.manifest
            ${{ env.FIRMWARE }}/sha256sums
            ${{ env.FIRMWARE }}/provenance-PZ-L8.txt
            ${{ env.FIRMWARE }}/Config-PZ-L8.txt
            ${{ env.FIRMWARE }}/pz-l8-sources.txt
          if-no-files-found: error

      - name: Upload config-only artifact
        if: ${{ inputs.TEST }}
        uses: actions/upload-artifact@v4
        with:
          name: pz-l8-config-${{ github.run_id }}
          path: upload/
          if-no-files-found: error

      - name: Publish release
        if: ${{ success() && !inputs.TEST }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dpd-fw-wrt-PZ-L8-${{ env.DATE }}
          name: DPD-FW-WRT PZ-L8 ${{ env.DATE }}
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            ${{ env.FIRMWARE }}/*.bin
            ${{ env.FIRMWARE }}/*.ubi
            ${{ env.FIRMWARE }}/*.fit
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/*.manifest
            ${{ env.FIRMWARE }}/sha256sums
            ${{ env.FIRMWARE }}/provenance-PZ-L8.txt
            ${{ env.FIRMWARE }}/Config-PZ-L8.txt
            ${{ env.FIRMWARE }}/pz-l8-sources.txt
          body: |
            **DPD-FW-WRT PZ-L8** — CMCC PZ-L8 / IPQ5018 + QCA8337 + QCN6122

            源码：openwrt/openwrt `${{ env.OPENWRT_REF }}`
            板级与 NSS 支持：`mufeng05/openwrt-cmcc-pz-l8-nss` @ `${{ env.PZ_L8_REF_COMMIT }}`
            代理：honk（上游 stock core，aarch64）+ luci-app-honk
            转发：Qualcomm NSS / ECM（硬件卸载）
            内存：256 MB 板级 pbuf 调优 + 64 MiB zram 压缩 swap

            登录地址：${{ env.WRT_IP }}
            登录密码：无
            WIFI：`${{ env.WRT_SSID }}`

            文件名：
            - `*-squashfs-sysupgrade.bin`：已在 OpenWrt 上时使用 `sysupgrade -n`
            - `*-squashfs-factory.ubi`：从厂商固件强制刷写
            - `*-uboot-recovery.fit`：U-Boot 网页恢复（192.168.10.10）
            - `*-uboot-recovery-116m.fit`：同时写入 110M 分区表，会改写 MIBIB，谨慎使用
            - `*-initramfs-uImage.itb`：内存启动，不写 flash

            详细说明见 `docs/pz-l8.md`。
